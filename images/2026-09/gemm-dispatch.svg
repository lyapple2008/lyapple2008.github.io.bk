<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
<rect width="100%" height="100%" fill="#FAF8F5"/>
<text x="600.00" y="40.00" fill="#1F2937" font-size="22" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, sans-serif" font-weight="600" text-anchor="middle" dy="0">Mac / iOS 上怎么选</text>
<rect x="360.00" y="70.00" width="480.00" height="70.00" fill="#E5E7EB" stroke="#1F2937" stroke-width="1.2" rx="12" ry="12"/>
<text x="600.00" y="112.00" fill="#1F2937" font-size="15" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, sans-serif" font-weight="600" text-anchor="middle" dy="0">要算的是通用 GEMM，还是网络里的一层？</text>
<rect x="40.00" y="200.00" width="350.00" height="100.00" fill="#BFDBFE" stroke="#3B82F6" stroke-width="1.3" rx="12" ry="12"/>
<text x="215.00" y="240.00" fill="#1F2937" font-size="16" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, sans-serif" font-weight="600" text-anchor="middle" dy="0">小矩阵 / 要融合</text>
<text x="215.00" y="268.00" fill="#6B7280" font-size="14" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, sans-serif" font-weight="500" text-anchor="middle" dy="0">手写 NEON 或 BNNS</text>
<rect x="425.00" y="200.00" width="350.00" height="100.00" fill="#A7F3D0" stroke="#10B981" stroke-width="1.3" rx="12" ry="12"/>
<text x="600.00" y="240.00" fill="#1F2937" font-size="16" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, sans-serif" font-weight="600" text-anchor="middle" dy="0">中大 GEMM</text>
<text x="600.00" y="268.00" fill="#6B7280" font-size="14" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, sans-serif" font-weight="500" text-anchor="middle" dy="0">Accelerate  cblas_sgemm</text>
<rect x="810.00" y="200.00" width="350.00" height="100.00" fill="#FDE68A" stroke="#F59E0B" stroke-width="1.3" rx="12" ry="12"/>
<text x="985.00" y="240.00" fill="#1F2937" font-size="16" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, sans-serif" font-weight="600" text-anchor="middle" dy="0">批量推理 / 图</text>
<text x="985.00" y="268.00" fill="#6B7280" font-size="14" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, sans-serif" font-weight="500" text-anchor="middle" dy="0">Metal · Core ML</text>
<rect x="40.00" y="340.00" width="350.00" height="150.00" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3" rx="12" ry="12"/>
<text x="215.00" y="400.00" fill="#1F2937" font-size="16" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, sans-serif" font-weight="600" text-anchor="middle" dy="0">N 很小、还要和激活</text>
<text x="215.00" y="442.00" fill="#6B7280" font-size="14" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, sans-serif" font-weight="500" text-anchor="middle" dy="0">函数焊在一起时，调用开销 &gt; 计算</text>
<rect x="425.00" y="340.00" width="350.00" height="150.00" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3" rx="12" ry="12"/>
<text x="600.00" y="400.00" fill="#1F2937" font-size="16" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, sans-serif" font-weight="600" text-anchor="middle" dy="0">默认答案。</text>
<text x="600.00" y="442.00" fill="#6B7280" font-size="14" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, sans-serif" font-weight="500" text-anchor="middle" dy="0">AMX 比手写快一个数量级，API 两端通用</text>
<rect x="810.00" y="340.00" width="350.00" height="150.00" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3" rx="12" ry="12"/>
<text x="985.00" y="400.00" fill="#1F2937" font-size="16" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, sans-serif" font-weight="600" text-anchor="middle" dy="0">形状固定、能进 ANE</text>
<text x="985.00" y="442.00" fill="#6B7280" font-size="14" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, sans-serif" font-weight="500" text-anchor="middle" dy="0">或 GPU 有足够并行时再走这条</text>
<line x1="480.00" y1="140.00" x2="215.00" y2="200.00" stroke="#6B7280" stroke-width="1.4" stroke-linecap="round"/>
<line x1="600.00" y1="140.00" x2="600.00" y2="200.00" stroke="#6B7280" stroke-width="1.4" stroke-linecap="round"/>
<line x1="720.00" y1="140.00" x2="985.00" y2="200.00" stroke="#6B7280" stroke-width="1.4" stroke-linecap="round"/>
<text x="600.00" y="540.00" fill="#6B7280" font-size="15" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, sans-serif" font-weight="500" text-anchor="middle" dy="0">iOS 和 macOS 是同一套 Accelerate。差的不是接口，是频率墙、热和 QoS。</text>
<text x="600.00" y="575.00" fill="#6B7280" font-size="15" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, sans-serif" font-weight="500" text-anchor="middle" dy="0">产品代码：先调用系统库。手写到 NEON 微核，是为了看懂系统库在做什么。</text>
</svg>
